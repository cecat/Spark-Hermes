# FALDA provider — experiment condition.
# "One file + restart = one condition." Edit, re-run ops/apply-memory-provider.sh,
# restart the gateway, and every telemetry line is stamped with condition_label.
#
# The 2x2 ablation grid lives in these four independent switches:
#   prefetch_enabled     {true,false}   — automatic recall injection before each turn
#   search_tool_enabled  {true,false}   — the on-demand falda_search tool
# plus (independent):
#   system_prompt_block_enabled          — inject the T3 core doc statically
#   share_tool_enabled                   — the deliberate cross-agent falda_share tool
#
# Committed default = Step A baseline: provider PRESENT, everything OFF.
# This isolates "provider loaded" from "recall active".

condition_label: "phase0-inject_absent"

# --- recall (each independent) ---
prefetch_enabled: true
system_prompt_block_enabled: false

# --- tools (each independent — do NOT couple to prefetch) ---
share_tool_enabled: false
search_tool_enabled: false

# --- prefetch shape (used only when prefetch_enabled) ---
prefetch_tiers: [stream, atoms]   # subset of {stream, atoms}
prefetch_include_shared: true     # also query the shared-corpus pool
topk_stream: 5
topk_atoms: 5
max_chars_per_turn: 2000

# --- RRF weights: CURRENTLY INERT ---
# FALDA hardcodes RRF (1/(RRF_K+i), equal dense/lexical) in src/falda.ts.
# These are logged into telemetry (intended-vs-actual) but have NO effect until
# an upstream FALDA patch makes RRF configurable. See docs/FALDA-FINDINGS.md.
rrf_dense_weight: 1.0
rrf_lexical_weight: 1.0

# --- endpoint / addressing ---
falda_base_url: "http://host.openshell.internal:8077"
tenant: "gandalf"
shared_pool: "shared-corpus"
http_timeout: 10

# telemetry_dir: ""   # empty => $HERMES_HOME/telemetry
