# SPDX-License-Identifier: Apache-2.0
#
# Permit egress from the **cecat** sandbox to the Telegram Bot API, so the
# OpenClaw Telegram channel plugin can long-poll getUpdates and send replies.
#
# WHY THIS IS SEPARATE FROM telegram-egress.yaml (Gandalf's)
# Egress presets key on the **peer binary**, and the two runtimes reach Telegram
# with different ones. Gandalf is Hermes: the adapter is Python inside
# /opt/hermes/.venv, and telegram-egress.yaml lists only Python + the hermes
# launcher. cecat is OpenClaw: the plugin runs in-process and the socket is
# opened by node. Gandalf's preset therefore cannot serve her — it would fail
# closed on every call. Exactly the same split as the Slack presets.
#
# WHY THE ENDPOINT LIST IS TIGHTER THAN GANDALF'S
# This mirrors NemoClaw v0.0.108's own OpenClaw Telegram preset
# (src/lib/messaging/channels/telegram/policy/openclaw.yaml), which scopes to
# /bot*/** rather than /**. Upstream is authoritative for the OpenClaw side;
# Gandalf's broader paths are left alone.
#
# ONE HOST covers everything:
#   api.telegram.org  Bot API (getUpdates long-poll, sendMessage, …) on
#                     /bot<token>/…, and file downloads on /file/bot<token>/…
# No host-side daemon is needed — unlike Signal, the Telegram adapter is
# in-process, the same shape as Slack Socket Mode.
#
# Apply with:
#   bash ops/nmc.sh cecat policy add --from-file bringup/50-openshell-policies/cecat-telegram-egress.yaml --yes
#
# Do NOT use a bare `nemoclaw cecat ...` — the global CLI is v0.0.55 and will
# hijack the plane. See the header of ops/nmc.sh.

preset:
  name: cecat-telegram-egress
  description: "cecat sandbox: Telegram Bot API (long-poll + send + file download) for the OpenClaw telegram channel plugin (Node)."

network_policies:
  cecat_telegram:
    name: cecat_telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # getUpdates is a long-lived GET; getMe/getChat are GET.
          - allow: { method: GET, path: "/bot*/**" }
          # sendMessage / sendChatAction / setMyCommands are POST.
          - allow: { method: POST, path: "/bot*/**" }
          # Voice/image/document downloads.
          - allow: { method: GET, path: "/file/bot*/**" }

    binaries:
      # OpenClaw runs the Telegram plugin in-process, so the socket is opened by
      # node itself. Do NOT copy Gandalf's Python paths here.
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
